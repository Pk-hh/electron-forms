<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Electron Forms</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;">

  <!-- Mesh Background -->
  <div style="
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.08) 0%, transparent 40%);
    z-index: -1;
  "></div>

  <div class="glass-card auth-card" style="width: 100%; max-width: 440px; padding: 40px; border-radius: var(--radius-xl);">
    
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 32px;">
      <a href="index.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 24px; font-weight: 800; font-family: var(--font-display); color: var(--text-primary); margin-bottom: 12px;">
        <i data-lucide="check-square" style="color: var(--accent-color); width: 32px; height: 32px;"></i>
        Electron Forms
      </a>
      <p style="color: var(--text-secondary); font-size: 14px;">Create your account to start building.</p>
    </div>

    <!-- Register Form -->
    <form id="register-form">
      <div class="form-group">
        <label for="fullname" class="form-label">Full Name</label>
        <div style="position: relative;">
          <input type="text" id="fullname" class="form-control" placeholder="Jane Doe" required style="padding-left: 40px;">
          <i data-lucide="user" style="position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; color: var(--text-secondary);"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <div style="position: relative;">
          <input type="email" id="email" class="form-control" placeholder="name@company.com" required style="padding-left: 40px;">
          <i data-lucide="mail" style="position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; color: var(--text-secondary);"></i>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 28px;">
        <label for="password" class="form-label">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required style="padding-left: 40px;">
          <i data-lucide="lock" style="position: absolute; left: 12px; top: 12px; width: 18px; height: 18px; color: var(--text-secondary);"></i>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px; margin-bottom: 24px;">
        Create Account
      </button>
    </form>

    <!-- Footer Redirect -->
    <p style="text-align: center; font-size: 14px; color: var(--text-secondary);">
      Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
    </p>

  </div>

  <!-- Scripts -->
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
    <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    // Handle registration submit
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('fullname').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (password.length < 6) {
        Utils.showToast("Password must be at least 6 characters.", "error");
        return;
      }
      
      try {
        await window.auth.register(email, password, name);
      } catch (err) {
        // Handled in auth.js using toast
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    });
  </script>
</body>
</html>
