<!DOCTYPE html>
<html lang="en" class="light-theme">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings - Electron Forms</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Sidebar -->
    <aside class="dashboard-sidebar glass-panel">
      <div class="sidebar-brand">
        <i data-lucide="check-square" style="color: var(--accent-color); width: 28px; height: 28px;"></i>
        <span>Electron Forms</span>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-nav-item">
          <i data-lucide="arrow-left"></i>
          <span>Back to Dashboard</span>
        </a>
        <a href="profile.html" class="sidebar-nav-item active">
          <i data-lucide="user"></i>
          <span>Profile Settings</span>
        </a>
        <a href="settings.html" class="sidebar-nav-item">
          <i data-lucide="settings"></i>
          <span>Workspace Settings</span>
        </a>
      </nav>

      <!-- Sidebar Footer -->
      <div style="border-top: 1px solid var(--border-light); padding-top: 16px; display: flex; flex-direction: column; gap: 8px;">
        <button id="theme-toggle-btn" class="sidebar-nav-item" style="background: transparent; border: none; width: 100%; text-align: left;">
          <i data-lucide="moon"></i>
          <span>Toggle Theme</span>
        </button>
        <button id="signout-btn" class="sidebar-nav-item" style="background: transparent; border: none; width: 100%; text-align: left; color: var(--danger);">
          <i data-lucide="log-out"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main" style="padding: 40px; overflow-y: auto;">
      <h2 style="margin-bottom: 24px;">Profile Settings</h2>

      <div class="glass-card" style="max-width: 600px;">
        <form id="profile-edit-form">
          
          <!-- Avatar Preview Row -->
          <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 28px;">
            <img src="" id="profile-avatar-preview" style="width: 80px; height: 80px; border-radius: var(--radius-full); object-fit: cover; border: 2px solid var(--accent-color);" alt="Avatar Preview">
            <div>
              <h4 style="font-size: 16px; margin-bottom: 4px;">Profile Picture</h4>
              <p style="font-size: 12px; color: var(--text-secondary);">Provide a direct image link to update your avatar.</p>
            </div>
          </div>

          <div class="form-group">
            <label for="profile-name" class="form-label">Full Name</label>
            <input type="text" id="profile-name" class="form-control" placeholder="Creative Creator" required>
          </div>

          <div class="form-group">
            <label for="profile-email" class="form-label">Email Address</label>
            <input type="email" id="profile-email" class="form-control" disabled style="opacity: 0.6; cursor: not-allowed;">
            <p style="font-size: 11px; color: var(--text-secondary); margin-top: 4px;">Registered email addresses cannot be modified on mock storage accounts.</p>
          </div>

          <div class="form-group">
            <label for="profile-avatar-url" class="form-label">Avatar Image URL</label>
            <input type="url" id="profile-avatar-url" class="form-control" placeholder="https://images.unsplash.com/...">
          </div>

          <div style="text-align: right; margin-top: 24px;">
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
    <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
  
  <script>
    let activeUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      activeUser = await window.auth.getCurrentUser();
      if (!activeUser) return;

      document.getElementById('profile-name').value = activeUser.displayName || '';
      document.getElementById('profile-email').value = activeUser.email || '';
      document.getElementById('profile-avatar-url').value = activeUser.photoURL || '';
      document.getElementById('profile-avatar-preview').src = activeUser.photoURL || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80';

      // Update avatar preview dynamically when input changes
      document.getElementById('profile-avatar-url').addEventListener('input', (e) => {
        const preview = document.getElementById('profile-avatar-preview');
        preview.src = e.target.value || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80';
      });

      // Submit changes
      document.getElementById('profile-edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newName = document.getElementById('profile-name').value.trim();
        const newPhoto = document.getElementById('profile-avatar-url').value.trim();

        try {
          await window.db.updateProfile(newName, newPhoto);
          Utils.showToast("Profile details updated successfully!", "success");
        } catch(err) {
          Utils.showToast("Failed to update profile", "error");
        }
      });

      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
